name: Buzz
options:
  bundleIdPrefix: studio.overclock
  deploymentTarget:
    iOS: "17.2"
  createIntermediateGroups: true

packages:
  BezelKit:
    url: https://github.com/markbattistella/BezelKit
    from: "4.1.1"
  BuzzKit:
    path: ../BuzzKit-iOS

settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: 5DL44U5BHU
    CODE_SIGN_STYLE: Automatic

targets:
  Buzz:
    type: application
    platform: iOS
    sources:
      - path: Buzz
      - path: Shared
    dependencies:
      - package: BezelKit
      - package: BuzzKit
        product: BuzzKit
      - target: BuzzWidget
      - target: BuzzNotificationService
    info:
      path: Buzz/Resources/Info.plist
      properties:
        CFBundleDisplayName: Buzz
        NSLocalNetworkUsageDescription: Connect to your development Mac to set up Buzz.
        UILaunchScreen: {}
        UIBackgroundModes: [remote-notification]
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIAppFonts: [OpenRunde-Regular.otf, OpenRunde-Medium.otf, OpenRunde-Semibold.otf]
        NSUserActivityTypes: [INSendMessageIntent]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            "100.102.32.85":
              NSExceptionAllowsInsecureHTTPLoads: true
    entitlements:
      path: Buzz/Resources/Buzz.entitlements
      properties:
        aps-environment: development
        com.apple.developer.usernotifications.time-sensitive: true
        com.apple.developer.usernotifications.communication: true
        com.apple.security.application-groups:
          - group.studio.overclock.buzz
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: studio.overclock.buzz
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  BuzzWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: BuzzWidget
      - path: Shared
    info:
      path: BuzzWidget/Info.plist
      properties:
        CFBundleDisplayName: Buzz
        UIAppFonts: [OpenRunde-Regular.otf, OpenRunde-Medium.otf, OpenRunde-Semibold.otf]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: BuzzWidget/BuzzWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.studio.overclock.buzz
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: studio.overclock.buzz.widget

  BuzzNotificationService:
    type: app-extension
    platform: iOS
    sources:
      - path: BuzzNotificationService
      - path: Shared/Networking/BuzzStore.swift
      - path: Shared/Networking/AgentLabel.swift
      - path: Shared/Networking/AvatarStore.swift
      - path: Shared/Resources/Agents.xcassets
    dependencies:
      - package: BuzzKit
        product: BuzzKitNotificationServiceExtension
    info:
      path: BuzzNotificationService/Info.plist
      properties:
        CFBundleDisplayName: Buzz
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    entitlements:
      path: BuzzNotificationService/BuzzNotificationService.entitlements
      properties:
        com.apple.security.application-groups:
          - group.studio.overclock.buzz
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: studio.overclock.buzz.notificationservice

  BuzzUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: BuzzUITests
    dependencies:
      - target: Buzz
    info:
      path: BuzzUITests/Info.plist
      properties:
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: studio.overclock.buzz.uitests
        TEST_TARGET_NAME: Buzz

schemes:
  Buzz:
    build:
      targets:
        Buzz: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - BuzzUITests
